server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.tomcat.threads.max=64
server.tomcat.threads.min-spare=4
server.tomcat.accept-count=64
server.tomcat.max-connections=256
server.tomcat.connection-timeout=2s
server.max-http-request-header-size=8KB
spring.datasource.url=${JDBC_URL:jdbc:postgresql://localhost:5432/burstlab}
spring.datasource.username=${JDBC_USERNAME:burstlab}
spring.datasource.password=${JDBC_PASSWORD:burstlab-local}
spring.datasource.hikari.maximum-pool-size=16
spring.datasource.hikari.connection-timeout=500
spring.datasource.hikari.validation-timeout=250
spring.datasource.hikari.data-source-properties.socketTimeout=5
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
spring.task.scheduling.pool.size=2
logging.pattern.console=%d{ISO8601} %-5level [%thread] [correlation=%X{correlationId}] %logger{25} : %msg%n
